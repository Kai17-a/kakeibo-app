[package]
name = "kakeibo-app"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {
    version = "1",
    features = ["macros", "rt-multi-thread"]
}

sqlx = {
    version = "0.9",
    default-features = false,
    features = [
        "runtime-tokio",
        "sqlite",
        "macros",
        "migrate",
    ]
}
