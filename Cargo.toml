[package]
name = "kakeibo-app"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {
    version = "1",
    features = ["macros", "rt-multi-thread"]
}
serde = { version = "1", features = ["derive"] }

sqlx = {
    version = "0.9",
    default-features = false,
    features = [
        "runtime-tokio",
        "sqlite",
        "macros",
        "migrate",
    ]
}
axum = "0.8.9"
utoipa = "5"
utoipa-swagger-ui = {
    version = "9",
    features = ["axum", "vendored"]
}
