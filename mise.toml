[tools]
gh = "latest"
"pipx:sqlfluff" = "latest"
prek = "latest"
rust = "latest"

[tasks.setup]
description = "Install tools and Git hooks"
run = [
  "mise install",
  "prek install --hook-type pre-commit",
  "prek install --hook-type commit-msg",
  "prek install --hook-type pre-push",
  "prek install-hooks",
]

[tasks.build]
description = "Build the CLI"
run = "cargo build"

[tasks.build-release]
description = "Build the CLI for release"
run = "cargo build --release"

[tasks.check]
description = "Check the project without building"
run = "cargo check --all-targets --all-features"

[tasks.test]
description = "Run tests"
run = "cargo test --all-features"

[tasks.test-release]
description = "Run tests in release mode"
run = "cargo test --release --all-features"

[tasks.format]
description = "Format Rust source code"
run = "cargo fmt --all"

[tasks.format-check]
description = "Check Rust source code formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run Clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.fix]
description = "Automatically fix Clippy warnings"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features"

[tasks.run]
description = "Run the CLI"
run = "cargo run"

[tasks.run-release]
description = "Run the CLI in release mode"
run = "cargo run --release"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.sql-format]
description = "Format SQL files"
run = "sqlfluff format ."

[tasks.sql-lint]
description = "Lint SQL files"
run = "sqlfluff lint ."

[tasks.prek]
description = "Run all prek hooks"
run = "prek run --all-files"

[tasks.ci]
description = "Run all CI checks"
depends = [
  "format-check",
  "check",
  "clippy",
  "test",
  "sql-lint",
]

[tasks.test-data-add]
description = "Add test data to the database"
run = "./scripts/test-data.sh add"

[tasks.test-data-clear]
description = "Clear test data from the database"
run = "./scripts/test-data.sh clear"
